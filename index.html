<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tragos Trivia">
    <title>Tragos Trivia</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 20px;
            padding-top: env(safe-area-inset-top, 20px);
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
        }

        .container {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 16px;
        }

        h1, h2 {
            margin-top: 0;
            text-align: center;
        }

        .pot-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            text-align: center;
            font-weight: 800;
            font-size: 1.3rem;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .player-turn {
            text-align: center;
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
            line-height: 1.4;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-bottom: 10px;
        }

        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-accent { background-color: var(--accent); color: #0f172a; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-outline { background-color: transparent; border: 2px solid #475569; color: var(--text); }

        .player-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .remove-btn {
            width: auto;
            padding: 5px 10px;
            margin: 0;
            background: var(--danger);
            font-size: 0.8rem;
            color: white;
            border-radius: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .hidden { display: none !important; }

        .drink-alert {
            text-align: center;
            padding: 20px 0;
        }

        .drink-alert h2 {
            color: var(--danger);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .drink-count {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent);
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA 1: MENÚ DE JUGADORES -->
    <div id="setup-screen" class="card">
        <h1>🍻 Cultura & Tragos</h1>
        <p style="text-align:center; color: var(--text-muted); font-size: 0.9rem;">
            Acumula puntos o pasa el turno. El que falle, bebe todo el bote.
        </p>
        
        <div style="display: flex; gap: 8px;">
            <input type="text" id="player-name-input" placeholder="Nombre del jugador..." onkeypress="handleEnter(event)">
            <button class="btn-primary" style="width: auto; padding: 0 20px;" onclick="addPlayer()">+</button>
        </div>

        <ul id="player-list" class="player-list"></ul>

        <button id="start-btn" class="btn-success" onclick="startGame()" disabled>JUGAR (Mín. 2 jugadores)</button>
    </div>

    <!-- PANTALLA 2: JUEGO -->
    <div id="game-screen" class="hidden">
        <div class="pot-badge">
            🍺 Bote acumulado: <span id="pot-display">0</span> tragos
        </div>

        <div class="card">
            <div class="player-turn" id="current-player-display">Turno de: Jugador</div>
            <div class="question-text" id="question-display">¿Pregunta?</div>

            <!-- Fase 1: Respuesta directa o pedir opciones -->
            <div id="direct-answer-section">
                <input type="text" id="direct-input" placeholder="Escribe tu respuesta (+2 pts)..." autocomplete="off" onkeypress="handleDirectEnter(event)">
                <button class="btn-primary" onclick="checkDirectAnswer()">Responder (+2 tragos)</button>
                <button class="btn-accent" onclick="showOptions()">Pedir 4 opciones (+1 trago)</button>
            </div>

            <!-- Fase 2: 4 Opciones -->
            <div id="options-section" class="options-grid hidden"></div>

            <!-- Fase 3: Acierto -> ¿Continuar o Pasar? -->
            <div id="decision-section" class="hidden" style="margin-top: 20px;">
                <p style="text-align: center; color: var(--success); font-weight: bold; font-size: 1.2rem;">
                    ¡CORRECTO! 🎉
                </p>
                <button class="btn-primary" onclick="nextQuestionSamePlayer()">Seguir jugando (otra pregunta)</button>
                <button id="pass-btn" class="btn-outline" onclick="passTurn()">Pasar turno al siguiente</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA 3: FALLO / BEBER -->
    <div id="fail-screen" class="card hidden drink-alert">
        <h2>¡HAS FALLADO! ❌</h2>
        <p id="correct-answer-reveal" style="color: var(--text-muted);"></p>
        <p id="loser-message" style="font-size: 1.3rem; font-weight: bold; margin-top: 20px;"></p>
        <div class="drink-count" id="final-drinks">0 TRAGOS</div>
        <button class="btn-primary" onclick="continueAfterDrink()">Siguiente jugador</button>
    </div>
</div>

<!-- IMPORTANTE: Cargamos el archivo externo con las preguntas -->
<script src="preguntas.js"></script>

<script>
    let players = [];
    let currentPlayerIndex = 0;
    let pot = 0;
    let answeredInCurrentTurn = 0;
    let availableQuestions = [];
    let currentQuestion = null;

    function handleEnter(e) {
        if (e.key === 'Enter') addPlayer();
    }

    function handleDirectEnter(e) {
        if (e.key === 'Enter') checkDirectAnswer();
    }

    function addPlayer() {
        const input = document.getElementById('player-name-input');
        const name = input.value.trim();
        if (name && !players.includes(name)) {
            players.push(name);
            input.value = '';
            renderPlayers();
        }
    }

    function removePlayer(index) {
        players.splice(index, 1);
        renderPlayers();
    }

    function renderPlayers() {
        const list = document.getElementById('player-list');
        list.innerHTML = '';
        players.forEach((p, idx) => {
            list.innerHTML += `
                <li class="player-item">
                    <span>${idx + 1}. <strong>${p}</strong></span>
                    <button class="remove-btn" onclick="removePlayer(${idx})">X</button>
                </li>
            `;
        });
        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = players.length < 2;
        startBtn.textContent = players.length < 2 ? 'JUGAR (Mín. 2 jugadores)' : `JUGAR (${players.length} jugadores)`;
    }

    function startGame() {
        // MEZCLA ALEATORIA DE TODAS LAS PREGUNTAS AL INICIAR
        availableQuestions = [...questionsDB].sort(() => Math.random() - 0.5);
        currentPlayerIndex = 0;
        pot = 0;
        answeredInCurrentTurn = 0;
        
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        updateUI();
        loadNextQuestion();
    }

    function updateUI() {
        document.getElementById('pot-display').textContent = pot;
        document.getElementById('current-player-display').textContent = `Turno de: ${players[currentPlayerIndex]}`;
    }

    function loadNextQuestion() {
        if (availableQuestions.length ===0) {
            // Si se acaban todas las preguntas de la base de datos, se vuelve a barajar
            availableQuestions = [...questionsDB].sort(() => Math.random() - 0.5);
        }
        // Saca la primera pregunta de la lista ya barajada
        currentQuestion = availableQuestions.shift();

        document.getElementById('question-display').textContent = currentQuestion.q;
        document.getElementById('direct-input').value = '';
        
        document.getElementById('direct-answer-section').classList.remove('hidden');
        document.getElementById('options-section').classList.add('hidden');
        document.getElementById('decision-section').classList.add('hidden');
    }

    function normalizeText(str) {
        return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function checkDirectAnswer() {
        const userAns = normalizeText(document.getElementById('direct-input').value);
        if (!userAns) return;

        const isCorrect = currentQuestion.accept.some(valid => normalizeText(valid) === userAns);

        if (isCorrect) {
            handleCorrect(2);
        } else {
            handleFail();
        }
    }

    function showOptions() {
        document.getElementById('direct-answer-section').classList.add('hidden');
        const optionsGrid = document.getElementById('options-section');
        optionsGrid.innerHTML = '';
        optionsGrid.classList.remove('hidden');

        // Mezclar también las 4 opciones al azar para que la respuesta correcta no esté siempre en el mismo sitio
        const shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-outline';
            btn.textContent = opt;
            btn.onclick = () => {
                if (opt === currentQuestion.answer) {
                    handleCorrect(1);
                } else {
                    handleFail();
                }
            };
            optionsGrid.appendChild(btn);
        });
    }

    function handleCorrect(points) {
        pot += points;
        answeredInCurrentTurn++;
        updateUI();

        document.getElementById('direct-answer-section').classList.add('hidden');
        document.getElementById('options-section').classList.add('hidden');
        
        // Bloquear el botón de pasar si no ha respondido al menos una pregunta en este turno
        const passBtn = document.getElementById('pass-btn');
        if (answeredInCurrentTurn >= 1) {
            passBtn.disabled = false;
            passBtn.style.opacity = "1";
        } else {
            passBtn.disabled = true;
            passBtn.style.opacity = "0.4";
        }

        document.getElementById('decision-section').classList.remove('hidden');
    }

    function nextQuestionSamePlayer() {
        loadNextQuestion();
    }

    function passTurn() {
        if (answeredInCurrentTurn < 1) return;
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
        answeredInCurrentTurn = 0;
        updateUI();
        loadNextQuestion();
    }

    function handleFail() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('fail-screen').classList.remove('hidden');

        const loserName = players[currentPlayerIndex];
        const drinksToTake = pot > 0 ? pot : 1;

        document.getElementById('correct-answer-reveal').textContent = `La respuesta era: ${currentQuestion.answer}`;
        document.getElementById('loser-message').textContent = `${loserName} tiene que beber:`;
        document.getElementById('final-drinks').textContent = `${drinksToTake} ${drinksToTake === 1 ? 'TRAGO' : 'TRAGOS'}`;
    }

    function continueAfterDrink() {
        pot = 0;
        answeredInCurrentTurn = 0;
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;

        document.getElementById('fail-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        updateUI();
        loadNextQuestion();
    }
</script>

</body>
</html>
